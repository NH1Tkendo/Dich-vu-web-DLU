services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      POSTGRES_DB: ${POSTGRES_DB:-ebook2latex}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    image: ${DOCKER_USERNAME:-yourusername}/ebook2latex-backend:latest
    restart: always
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-admin123}@db:5432/${POSTGRES_DB:-ebook2latex}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
    volumes:
      - ./backend/uploads:/app/uploads
      - torch_cache:/root/.cache/torch
    depends_on:
      - db

  frontend:
    image: ${DOCKER_USERNAME:-yourusername}/ebook2latex-frontend:latest
    restart: always
    depends_on:
      - backend

  nginx:
    image: nginx:stable-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  torch_cache:
