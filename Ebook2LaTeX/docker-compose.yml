services:
  db:
    image: postgres:15-alpine
    container_name: ebook2latex-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ebook2latex
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ebook2latex-backend
    environment:
      - DATABASE_URL=postgresql+psycopg://user:password@db:5432/ebook2latex
      - CORS_ORIGINS=http://localhost,http://localhost:5173
    volumes:
      - ./backend/uploads:/app/uploads
      - torch_cache:/root/.cache/torch
    depends_on:
      - db
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ebook2latex-frontend
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  torch_cache:
